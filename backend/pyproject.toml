[project]
name = "backend"
version = "0.1.0"
description = "Signal clone backend"
authors = [
    { name = "Prajjwal Verma", email = "prajjwalverma74@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "libsql>=0.1.11",
    "pyjwt>=2.8",
    "uvicorn>=0.34.0",
    "websockets>=17.0.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
